spring.application.name=network-device-inventory-api
server.port=${PORT:8080}

# Local development defaults to an in-memory H2 database. Render/Neon set these variables externally.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:network_inventory;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=Network Device Inventory API
info.app.description=Spring Boot REST API for network asset inventory
info.app.version=1.0.0

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
